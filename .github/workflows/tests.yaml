name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run tests
        # QT_QPA_PLATFORM=offscreen allows PyQt6 widgets to run without a
        # real display. main_test.py runs in its own step below.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest aas_editor_test/ --ignore=aas_editor_test/main_test.py -v --tb=short

      - name: Run GUI walk-through test
        # Drives the full EditorApp through every item of TestPackage.aasx.
        # Chromium (QtWebEngine) needs no sandbox and no GPU on the runner.
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: python -m pytest aas_editor_test/main_test.py -v --tb=short -o faulthandler_timeout=300
